# Companies to monitor.
#
# slug_guesses: possible ATS "company slugs" to try (Greenhouse / Lever / Ashby).
# The agent auto-detects which one is correct on first run and caches the
# result in resolved_ats.json, so you rarely need to touch this file.
#
# careers_url: fallback link shown in the email if auto-detection fails
# (e.g. the company uses a custom in-house careers site like Stripe).
#
# tier: just for grouping in the email, doesn't affect filtering.

companies:
  # ---- Tier S ----
  - name: Character.AI
    tier: S
    slug_guesses: [character, character-ai, characterai]
    careers_url: https://character.ai/careers

  - name: Whatnot
    tier: S
    slug_guesses: [whatnot]
    careers_url: https://www.whatnot.com/careers

  - name: Stripe
    tier: S
    slug_guesses: [stripe]
    careers_url: https://stripe.com/careers/search
    known_custom: true   # Stripe runs its own careers platform, not a standard ATS

