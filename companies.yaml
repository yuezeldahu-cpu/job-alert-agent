# Companies to monitor.
#
# slug_guesses: possible ATS "company slugs" to try (Greenhouse / Lever / Ashby).
# The agent auto-detects which one is correct on first run and caches the
# result in resolved_ats.json, so you rarely need to touch this file.
#
# careers_url: fallback link shown in the email if auto-detection fails
# (e.g. the company uses a custom in-house careers site like Stripe, or a
# big-company platform like Workday, which this agent doesn't auto-query).
#
# tier: just for grouping in the email, doesn't affect filtering.
#
# Note on sub-brands: some companies you listed hire through a parent
# company's single careers site rather than their own (e.g. Instagram/
# WhatsApp -> Meta, YouTube/Google Pay/Google Wallet -> Google, Slack ->
# Salesforce, Amazon Pay/Twitch -> Amazon in most regions). Those are folded
# into the parent entry below instead of added as separate non-functional
# slugs. Twitch does run its own careers site, so it gets its own entry.

companies:
