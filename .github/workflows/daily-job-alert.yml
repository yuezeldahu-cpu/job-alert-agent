name: Daily job alert

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python job_agent.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-agent"
          git config user.email "actions@github.com"
          git add seen_jobs.json resolved_ats.json
          git diff --cached --quiet || git commit -m "Update seen jobs / resolved ATS [skip ci]"
          git push
